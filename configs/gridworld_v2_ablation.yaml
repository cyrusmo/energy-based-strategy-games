seed: 0
device: auto

env:
  version: v2
  grid_size: 7
  max_steps: 20
  attacker_start: [0, 0]
  defender_start: [3, 5]
  goal_positions:
    - [6, 6]
    - [0, 6]
  obstacles:
    - [0, 3]
    - [1, 3]
    - [3, 3]
    - [5, 3]
    - [6, 3]
  catch_radius: 0
  slip_prob: 0.0
  defender_period: 2

training:
  iterations: 2
  candidate_strategies: 8
  strategy_dim: 8

sampler:
  type: langevin
  max_heuristic_candidates: 1

evaluator:
  action_source: heuristic
  episodes_per_opponent: 1
  compute_exact: false

executor:
  action_source: parametric

selection:
  robustness_aware: true
  use_robustness_g: true

updates:
  train_policy: false
  train_ebm: true
  train_world_model: true

logging:
  enabled: true
  output_dir: outputs/public/ablations_v2
