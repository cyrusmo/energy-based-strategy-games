seed: 11
device: auto

env:
  version: v2
  grid_size: 7
  max_steps: 20
  attacker_start: [0, 0]
  defender_start: [3, 5]
  goal_positions:
    - [6, 6]
    - [0, 6]
  obstacles:
    - [0, 3]
    - [1, 3]
    - [3, 3]
    - [5, 3]
    - [6, 3]
  catch_radius: 0
  slip_prob: 0.0
  defender_period: 2

ppo:
  total_steps: 2048
  rollout_steps: 128
  update_epochs: 4
  minibatch_size: 64
  hidden_dim: 64
  learning_rate: 0.0003
  entropy_coef: 0.05
  reward_scale: 1.0
  shaping_coef: 1.0
  eval_episodes: 8
  eval_every_updates: 2
