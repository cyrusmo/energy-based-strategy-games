seed: 0
device: auto

env:
  version: v2
  grid_size: 7
  max_steps: 20
  attacker_start: [0, 0]
  defender_start: [3, 5]
  goal_positions:
    - [6, 6]
    - [0, 6]
  obstacles:
    - [0, 3]
    - [1, 3]
    - [3, 3]
    - [5, 3]
    - [6, 3]
  catch_radius: 0
  slip_prob: 0.0

training:
  iterations: 8
  candidate_strategies: 16
  strategy_dim: 8
  episodes_per_update: 1

ebm:
  hidden_dim: 64
  langevin_steps: 10
  langevin_step_size: 0.02
  langevin_noise_scale: 0.25

sampler:
  type: langevin
  max_heuristic_candidates: 1

evaluator:
  action_source: heuristic
  episodes_per_opponent: 1
  compute_exact: false
  robustness_alpha: 0.5

executor:
  action_source: parametric

selection:
  robustness_aware: true
  use_robustness_g: true
  average_value_weight: 1.0
  robustness_weight: 0.5
  exploitability_weight: 0.5
  goal_rate_weight: 1.0

updates:
  train_policy: true
  train_ebm: true
  train_world_model: true
  behavior_clone_iterations: 4
  behavior_clone_coef: 0.5
  entropy_coef: 0.05

logging:
  enabled: true
  output_dir: outputs/public/gridworld_v2
  run_name: gridworld_v2
