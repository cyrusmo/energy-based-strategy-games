seed: 11
device: auto

env:
  version: v2
  grid_size: 7
  max_steps: 20
  attacker_start: [0, 0]
  defender_start: [3, 5]
  goal_positions:
    - [6, 6]
    - [0, 6]
  obstacles:
    - [0, 3]
    - [1, 3]
    - [3, 3]
    - [5, 3]
    - [6, 3]
  catch_radius: 0
  slip_prob: 0.0
  defender_period: 2

ppo:
  # Hardened v2 settings; see reports/public/research_snapshot_2026-11-21.md.
  # 11 of 15 seeds reach the goal from the layout start; the rest stand off
  # against the scripted defender and time out.
  total_steps: 131072
  rollout_steps: 128
  update_epochs: 4
  minibatch_size: 64
  hidden_dim: 64
  learning_rate: 0.001
  entropy_coef: 0.01
  reward_scale: 1.0
  shaping_coef: 10.0
  shaping_mode: legacy
  random_start_prob: 0.5
  eval_episodes: 8
  eval_every_updates: 0
